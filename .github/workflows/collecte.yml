name: Collecte horaire

on:
  schedule:
    # Secours : le déclenchement principal est un cron externe (workflow_dispatch). GitHub saute souvent
    # les exécutions planifiées ; on garde une seule tentative par heure pour rester courtois avec l'API.
    - cron: "12 * * * *"
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte et génération de la page
        run: python collect.py
        env:
          PAGE_SORTIE: docs/index.html
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique_alliance.csv historique_joueurs.csv state.json
          git diff --cached --quiet || git commit -m "Données $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
